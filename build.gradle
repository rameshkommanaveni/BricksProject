plugins {
    id 'java'
	id 'war'
	id 'org.springframework.boot' version "${springboot_version}"
	id 'io.spring.dependency-management' version "${spring_dependency_version}"
}

group = 'com.ramesh'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

ext {
	set('springCloudVersion', "2025.1.3")
}



configurations {
  runtime.exclude group: "org.springframework.boot", module: "spring-boot-starter-logging"
}

dependencies {

	//Actuator
	implementation 'org.springframework.boot:spring-boot-starter-actuator'

	//Kafka
	implementation 'org.springframework.boot:spring-boot-starter-kafka'

	//Eureka
	implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'

	//DB dependencies
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	runtimeOnly 'com.h2database:h2'

	// Required for H2 Console with Spring Boot 4
	implementation 'org.springframework.boot:spring-boot-h2console'

	//Lombok
	compileOnly 'org.projectlombok:lombok:1.18.42'
	annotationProcessor 'org.projectlombok:lombok:1.18.42'
	testCompileOnly 'org.projectlombok:lombok:1.18.42'
	testAnnotationProcessor 'org.projectlombok:lombok:1.18.42'
	implementation 'org.apache.commons:commons-lang3:3.20.0'

	//logback
	implementation 'ch.qos.logback:logback-classic:1.6.5'
	implementation 'ch.qos.logback:logback-core:1.6.5'

	implementation 'org.hibernate.orm:hibernate-core'



	//Swagger dependencies
	implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdoc_version}"
	implementation "io.springfox:springfox-core:${springfox_version}"
	implementation "io.swagger:swagger-annotations:${swagger_version}"

	//testing
	testImplementation 'org.springframework.boot:spring-boot-starter-test'

	implementation 'javax:javaee-api:8.0.1'
	
	
}


dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}


tasks.named('test') {
	useJUnitPlatform()
}

tasks.named('wrapper') {
	gradleVersion ="7.6.3"
	distributionType = Wrapper.DistributionType.ALL
	
}

war{
enabled = false
}

springBoot{
mainClass.set("com.ramesh.profile.ProfileServiceInit")
}

bootWar {
enabled = true
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	destinationDirectory = project.layout.buildDirectory.dir('lib')
	archiveFileName = "profileservice.war"

}

bootJar{
destinationDirectory = project.layout.buildDirectory.dir('lib')
}




