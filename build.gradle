plugins {
	id 'java'
	id 'org.springframework.boot' version "${springboot_version}"
	id 'io.spring.dependency-management' version "${spring_dependency_version}"
}

group = 'com.in28minutes.microservices'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

ext {
	set('springCloudVersion', "2025.1.3")
}


//configurations {
//	runtime.exclude group: "org.springframework.boot", module: "spring-boot-starter-logging"
//}

dependencies {
	implementation 'org.springframework.boot:spring-boot-h2console'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	//implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-tomcat'





	//implementation "org.springframework.kafka:spring-kafka:${kafka_version}"
	//implementation 'org.springframework.kafka:spring-kafka'
	implementation 'org.springframework.boot:spring-boot-starter-kafka'
	implementation 'org.springframework.boot:spring-boot-starter-kafka-test'
	implementation 'org.springframework.boot:spring-boot-starter-data-rest'

	//implementation 'org.springframework.boot:spring-boot-starter-zipkin'

	//implementation 'org.springframework.cloud:spring-cloud-config-server'
	//implementation 'org.springframework.cloud:spring-cloud-starter-config'
	implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
	//implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-server'
	//implementation 'org.springframework.boot:spring-data-rest-hal-explorer'



	implementation 'mysql:mysql-connector-java:8.0.22'

	implementation 'io.github.resilience4j:resilience4j-spring-boot3:2.3.0'
	//implementation 'org.springframework.boot:spring-boot-starter-aop:4.0.0-M2'

	//Swagger dependencies
	implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdoc_version}"
	implementation "io.springfox:springfox-core:${springfox_version}"
	implementation "io.swagger:swagger-annotations:${swagger_version}"

	testImplementation 'junit:junit:4.12'
	//implementation 'log4j:log4j:1.2.17'
	implementation 'ch.qos.logback:logback-classic:1.6.5'
	implementation 'ch.qos.logback:logback-core:1.6.5'


	//implementation 'ch.qos.logback:logback-classic:1.2.3'


	implementation 'org.mockito:mockito-all:1.10.5'

	implementation 'javax.validation:validation-api:2.0.0.Final'

	implementation 'com.zaxxer:HikariCP:2.4.5'


	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'com.h2database:h2'
	//runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-kafka-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-zipkin-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'


}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}

tasks.named('test') {
	useJUnitPlatform()
}
