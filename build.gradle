plugins {
    id 'java'
    id 'war'
	id 'org.springframework.boot' version '2.7.18'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.ramesh'
version = '0.0.1-SNAPSHOT'
sourceCompatibility = '11'

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

configurations {
  runtime.exclude group: "org.springframework.boot", module: "spring-boot-starter-logging"
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	//implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	//implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	//implementation 'org.springframework.boot:spring-boot-starter-log4j2'
	//implementation 'org.springframework.kafka:spring-kafka'

   implementation 'org.hibernate:hibernate-core:5.6.15.Final'
	
	compileOnly 'org.projectlombok:lombok:1.18.24'
	annotationProcessor 'org.projectlombok:lombok:1.18.24'
	
	testCompileOnly 'org.projectlombok:lombok:1.18.24'
	testAnnotationProcessor 'org.projectlombok:lombok:1.18.24'
	implementation 'org.apache.commons:commons-lang3:3.20.0'
	
	implementation 'ch.qos.logback:logback-classic:1.2.3'
	//developmentOnly 'org.springframework.boot:spring-boot-devtools'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	//testImplementation 'org.springframework.kafka:spring-kafka-test'
	
	//swagger ui dependenceies 
	//implementation 'io.springfox:springfox-core:2.10.0'
	implementation 'io.swagger:swagger-annotations:1.6.6'
    implementation 'org.springdoc:springdoc-openapi-ui:1.7.0'
	
	//DB dependenceies
	implementation 'com.h2database:h2:2.1.214'
	implementation 'javax:javaee-api:8.0.1'
	
	
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.named('wrapper') {
	gradleVersion ="7.6.3"
	distributionType = Wrapper.DistributionType.ALL
	
}

war{
enabled = false
}

springBoot{
mainClass.set("com.ramesh.profile.ProfileServiceInit")
}

bootWar {
enabled = true
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	destinationDirectory = project.layout.buildDirectory.dir('lib')
	archiveFileName = "profileservice.war"

}

bootJar{
destinationDirectory = project.layout.buildDirectory.dir('lib')
}
