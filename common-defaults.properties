# Switch this property to DEBUG to see all spring-int steps in the logs.
root.log.level=INFO
logback.stdout.pattern=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} %M- %msg %n
logback.file.pattern=%d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %-5level %c{1} [%p] %m%n

#file.path=${catalina.home}/logs/spring-boot-security-oauth2/app-spring-boot-security-oauth2.log
file.path=C:/Users/ashis/logs/spring-boot-kafka-app/app-spring-boot-kafka.log
logback.file.path=${file.path}
logback.rollingPolicy.min.index=1
logback.rollingPolicy.max.index=25
logback.triggeringPolicy.max.file.size=100MB